# Blueprint de Render para el backend de Convive (Entrega 3, sección 4.4, pasos 6 a 8).
# En Render: New > Blueprint > seleccione este repositorio. Crea la API y la base PostgreSQL gratuitas.
services:
  - type: web
    name: convive-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    # Aplica las migraciones y carga los datos de prueba (el seed no hace nada si ya existen).
    startCommand: npx prisma migrate deploy && npx prisma db seed && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: convive-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: QR_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 30m
      - key: REFRESH_TOKEN_DAYS
        value: "7"
      - key: PAYMENT_PROVIDER
        value: mock
      - key: PUSH_PROVIDER
        value: log
      - key: DEMO_MODE
        value: "true"
      # Complete en el panel de Render después del primer despliegue:
      - key: PUBLIC_API_URL
        sync: false # https://convive-api.onrender.com
      - key: CORS_ORIGIN
        sync: false # https://<su-panel>.vercel.app,http://localhost:5173,http://localhost:8081
      - key: WOMPI_PUBLIC_KEY
        sync: false
      - key: WOMPI_PRIVATE_KEY
        sync: false
      - key: WOMPI_INTEGRITY_SECRET
        sync: false
      - key: WOMPI_EVENTS_SECRET
        sync: false
      - key: WOMPI_REDIRECT_URL
        sync: false

databases:
  - name: convive-db
    plan: free
    databaseName: convive
